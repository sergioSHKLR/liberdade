<style>
@font-face{font-family:"Roboto Mono Site";src:url("/fonts/roboto-mono-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{--mono:"Roboto Mono Site","Roboto Mono",ui-monospace,Menlo,Consolas,monospace}
:root{--navy:#0b1f3a;--navy2:#12294b;--line:#29466f;--txt:#f5f7fb;--mut:#b7c3d7;--gold:#e3c26a;--ok:#5fd39a;--no:#ff8a7a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);color:var(--txt);font:18px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:0 22px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--gold);color:var(--navy);border-bottom:1px solid #b8963f}
.top .lang{border-color:var(--navy)}.top .lang button{color:var(--navy)}.top .lang{border:0;border-radius:0;gap:2px}
.top .lang button{min-width:36px;min-height:36px;padding:0 6px;font-size:.8rem;font-weight:500;letter-spacing:.06em;color:var(--navy);opacity:.7;background:none}
.top .lang button[aria-pressed=true]{background:none;color:var(--navy);opacity:1;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.top .lang button:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}.top .brand .ic{stroke:var(--gold)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:1.15rem;line-height:1}
.brand .badge-ic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--navy);flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{min-width:56px;min-height:44px;background:none;color:var(--txt);border:0;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--txt);color:var(--navy)}
.hero{text-align:center;padding:44px 0 40px}
.badge{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--mono);font-weight:800;line-height:.95;text-transform:uppercase;padding:22px 30px;border:2px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--navy2),var(--navy))}
.badge .ok{color:var(--ok);font-size:clamp(4.5rem,30vw,8rem)}
.badge .or{color:var(--mut);font-size:clamp(1.4rem,7vw,2.2rem);letter-spacing:.3em;margin:.25em 0 .2em .3em}
.badge .no{color:var(--no);font-size:clamp(4.5rem,30vw,8rem)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.status{color:var(--mut);font-size:1.1rem;margin:.9em 0 0}
.div{display:block;width:160px;margin:26px auto 6px;fill:none;stroke:var(--gold);stroke-width:1.5}
.div path:last-child{fill:var(--gold);stroke:none}
h1{font-size:clamp(2.3rem,11vw,3.2rem);margin:.15em 0 .3em;letter-spacing:.03em}
.obj{font-size:1.2rem;font-weight:600;margin:0 auto}
.sub{color:var(--mut);margin:.8em 0 0}
section{padding:36px 0;border-top:1px solid var(--line)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh h2{font-size:1.4rem;line-height:1.25;margin:0}
.ic{flex:none;width:28px;height:28px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand .ic{width:20px;height:20px}
.lead{font-size:1.15rem;font-weight:600}
.laurel{display:block;width:120px;margin:0 auto 8px;fill:none;stroke:var(--gold);stroke-width:1.5}
.laurel .lf,.laurel .st{fill:var(--gold);stroke:none;opacity:.85}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 6px;align-items:start}
figure{margin:0}
figure img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:50% 15%;border-radius:12px;border:1px solid var(--line);background:var(--navy2)}
figcaption{font-size:.9rem;color:var(--mut);text-align:center;margin-top:6px}
.arrow{text-align:center;font-family:ui-monospace,Menlo,monospace;color:var(--gold);letter-spacing:.15em;margin:4px 0 0}
.tl{display:block;width:100%;height:auto;margin:18px 0}
.tl .ln{stroke:var(--line);stroke-width:3}
.tl .pt circle{fill:var(--navy);stroke:var(--gold);stroke-width:3}
.tl text{text-anchor:middle;font-family:system-ui,sans-serif}
.tl .yr text{fill:var(--txt);font-weight:700;font-size:15px}
.tl .lb text{fill:var(--mut);font-size:13px}
.quote{border-left:4px solid var(--gold);padding:.2em 0 .2em 1em;font-style:italic;font-size:1.1rem}
.list{padding-left:1.2em}.list li{margin:.5em 0}
.ask{text-align:center;font-size:1.35rem;font-weight:700;color:var(--gold);margin-top:1.2em}
.note{color:var(--mut);font-size:.95rem}
.grid{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.grid li{background:var(--navy2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:16px 18px;font-weight:650;font-size:1.08rem}
.grid small{display:block;font-weight:400;color:var(--mut);font-size:.82rem;margin-top:6px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.hand{display:block;width:56px;height:56px;margin:4px auto 14px;stroke:var(--gold);stroke-width:2}
.chute{display:block;width:44px;margin:22px auto 4px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.verse{margin:16px 0;padding:18px 20px;background:var(--navy2);border:1px solid var(--line);border-radius:12px;text-align:center}
.verse p{margin:0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.12rem}
.verse cite{display:block;margin-top:10px;color:var(--gold);font-style:normal;font-size:.9rem;letter-spacing:.08em}
.yt{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
.yt iframe,.ytb{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytb{padding:0;background:none;cursor:pointer}
.ytb img{width:100%;height:100%;object-fit:cover;display:block}
.ytb svg{position:absolute;left:50%;top:50%;width:68px;height:48px;transform:translate(-50%,-50%)}
.lic{font-size:.78rem;margin-top:8px}.lic a{color:inherit}
.badge .q{color:#fff}
.ic *,.hand *,.chute *{vector-effect:non-scaling-stroke}
.ic,.hand,.chute{stroke-width:2}
.social{margin:18px 0 10px}
.social-h{margin:0 0 6px;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.social-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.social-row a{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;color:var(--txt);opacity:.8}
.social-row a:hover,.social-row a:focus-visible{opacity:1;color:var(--gold)}
.social-row a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.social-row svg{width:20px;height:20px;fill:currentColor}
.intro{--tb:57px;padding:0;border:0;margin:0;position:relative;height:calc(100vh - var(--tb));height:calc(100svh - var(--tb));background:#050e1e;color:#fff}
.anim .intro{height:280vh}
.intro .pin{position:sticky;top:var(--tb);height:calc(100vh - var(--tb));height:calc(100svh - var(--tb));overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.intro .ibg{position:absolute;left:0;right:0;top:-6%;height:118%;will-change:transform}
.intro .ibg img{width:100%;height:100%;object-fit:cover;object-position:58% 25%;display:block}
.intro .pin::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,14,30,.35),rgba(5,14,30,.15) 40%,rgba(5,14,30,.75) 85%,#0b1f3a)}
.intro .stage{position:relative;z-index:1;padding:64px 22px 40px}
.intro .q3{margin:0;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-weight:700;line-height:.95;text-transform:uppercase;text-shadow:0 2px 24px rgba(2,8,20,.85)}
.intro .ok{color:var(--ok);font-size:clamp(4.5rem,28vw,9rem)}
.intro .or{color:#cdd7e8;font-size:clamp(1.4rem,7vw,2.4rem);letter-spacing:.3em;margin:.3em 0 .25em .3em}
.intro .no{color:var(--no);font-size:clamp(4.5rem,28vw,9rem)}
.intro .q{color:#fff}
.intro .rule{margin:1.2em auto 0;max-width:22ch;font-size:clamp(1.3rem,5.6vw,2rem);font-weight:800;line-height:1.2;color:#fff;text-shadow:0 2px 18px rgba(2,8,20,.9)}
.intro .legend{margin:1.1em auto 0;max-width:34ch;font-family:var(--mono);font-weight:700;color:#cdd7e8;text-shadow:0 2px 14px rgba(2,8,20,.95)}
.intro .legend p{margin:0}
.intro .lg1{font-size:clamp(.8rem,3.3vw,1rem);line-height:1.35}
.intro .jp{margin:.7em auto 0;font-family:var(--mono);font-weight:700;font-size:clamp(1.25rem,6.2vw,2.1rem);line-height:1.15;color:var(--gold,#e8c35a);text-shadow:0 2px 16px rgba(2,8,20,.95)}
.intro .rule{margin-top:.9em!important}
.intro .s{display:block}
.anim .intro .s:not(.s1){opacity:0;transform:translate3d(0,22px,0);transition:opacity .6s ease,transform .6s ease}
.anim .intro .s.on{opacity:1;transform:none}
.intro .cue{position:absolute;z-index:1;bottom:42px;left:0;right:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#cdd7e8;transition:opacity .4s}
.intro .cue .ic{width:22px;height:22px}
.anim .intro .cue .ic{animation:nudge 1.8s ease-in-out infinite}
.intro .cue.off{opacity:0}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.intro .icredit{position:absolute;z-index:1;bottom:8px;left:0;right:0;margin:0;padding:0 12px;font-size:.66rem;line-height:1.3;color:rgba(205,215,232,.75)}
.intro .icredit a{color:inherit}
@media (prefers-reduced-motion:reduce){.intro .cue .ic{animation:none}}
footer{text-align:center;color:var(--mut);font-size:.9rem;padding:24px 22px 48px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<!--BODY-->
<script>
(function(){
var b=document.querySelectorAll('[data-set]');
function set(l){
document.documentElement.lang=l==='en'?'en':'pt-BR';
document.querySelectorAll('[data-pt]').forEach(function(e){var t=e.getAttribute('data-'+l);if(e.hasAttribute('data-html'))e.innerHTML=t;else e.textContent=t});
document.querySelectorAll('[data-alt-pt]').forEach(function(e){e.alt=e.getAttribute('data-alt-'+l)});
document.querySelectorAll('[data-label-pt]').forEach(function(e){e.setAttribute('aria-label',e.getAttribute('data-label-'+l))});
document.title=l==='en'?'Freedom':'Liberdade';
b.forEach(function(x){x.setAttribute('aria-pressed',x.dataset.set===l)});
try{localStorage.setItem('lang',l)}catch(e){}}
b.forEach(function(x){x.addEventListener('click',function(){set(x.dataset.set)})});
document.querySelectorAll('.yt .ytb').forEach(function(btn){btn.addEventListener('click',function(){var d=btn.parentNode,f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+d.dataset.id+'?autoplay=1&start='+(parseInt(d.dataset.start,10)||0);f.title=btn.getAttribute('aria-label');f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';d.replaceChild(f,btn);f.focus()})});
var I=document.querySelector('.intro');
if(I&&document.documentElement.classList.contains('anim')){
var G=I.querySelector('.ibg'),S=I.querySelectorAll('.s'),C=I.querySelector('.cue'),T=[0,.13,.26,.4,.53,.68],st=-1,ticking=false;
function up(){ticking=false;var r=I.getBoundingClientRect(),tot=r.height-innerHeight,p=tot>0?Math.min(1,Math.max(0,-r.top/tot)):1;
G.style.transform='translate3d(0,'+(-p*10).toFixed(2)+'%,0)';
var n=0;for(var i=0;i<T.length;i++)if(p>=T[i])n=i;
if(n!==st){st=n;S.forEach(function(e,i){e.classList.toggle('on',i<=n)})}
C.classList.toggle('off',p>.75)}
function req(){if(!ticking){ticking=true;requestAnimationFrame(up)}}
addEventListener('scroll',req,{passive:true});addEventListener('resize',req,{passive:true});up()}
var s=null;try{s=localStorage.getItem('lang')}catch(e){}
if(s==='en'||(!s&&location.hash==='#en'))set('en');
})();
</script>
</body>
